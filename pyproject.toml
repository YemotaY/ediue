[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ediue"
dynamic = ["version"]
description = "Übersetzt EDIFACT-Nachrichten (z. B. ORDERS) in lesbare Bestellungen."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "YemotaY" }]
keywords = ["edifact", "edi", "orders", "eancom", "bestellung"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: German",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ediue = "ediue.cli:main"

[tool.hatch.version]
path = "src/ediue/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
